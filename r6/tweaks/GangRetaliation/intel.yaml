# Gang Retaliation - intel: "Extraer datos" sobre un pandillero que el mod dejo inconsciente.
# Copia de la accion nativa "Invadir red" (Takedown.BreachUnconsciousOfficer), misma capa (Loot). Cambios:
# - actionName propio: con "PhysicalBreach" el juego la volvia un AccessBreach (subida + minijuego) que no terminaba;
# - activationTime vacio: el juego la completa enseguida y redscript hace la extraccion (barra de 3 s en el HUD);
# - sin el prereq de Officer (sobre el objetivo) ni el de ciberdeck (sobre V), y sin "V en exploracion" (se usa en combate);
# - solo sobre NPC con el estado GangRetaliation.IntelTarget (lo pone redscript a los elegibles al tirarlos).
# Ningun record Character.* la tiene: redscript la agrega a los NPC inconscientes (wrap de GetValidChoices).

Takedown.GRExtractData:
  $base: Takedown.BreachUnconsciousOfficer
  actionName: GRExtractData
  activationTime: []
  rewards: []
  instigatorPrereqs:
    - Takedown.GeneralStateChecks
    - Takedown.IsPlayerInAcceptableGroundLocomotionState
    - Takedown.PlayerNotInSafeZone
    - Takedown.GameplayRestrictions
    - Takedown.BreachUnconsciousOfficer_inline0
    - Takedown.BreachUnconsciousOfficer_inline1
  targetPrereqs:
    - Takedown.BreachUnconsciousOfficer_inline4
    - GangRetaliation.IntelTargetPrereq
  objectActionUI: Interactions.GRExtractData

# Tecla 1 (Choice3, apretar): R (Choice2_Hold) es "Recoger cuerpo" y F es "Coger"/"Cogerlo todo".
# Texto: LocKey#7000 es "Extract Data" / "Extraer datos" del juego, ya traducido a todos los idiomas.
Interactions.GRExtractData:
  $base: Interactions.BreachUnconsciousOfficer
  action: Choice3
  caption: LocKey#7000

# Marca de "se le pueden extraer datos": un estado vacio, sin efectos (copia de BaseStatusEffect.BlockGrapple).
GangRetaliation.IntelTarget:
  $base: BaseStatusEffect.BlockGrapple

GangRetaliation.IntelTargetPrereq:
  $base: Takedown.BreachUnconsciousOfficer_inline4
  statusEffect: GangRetaliation.IntelTarget

# Casilla "GUARIDAS" en la lista de filtros del mapa grande (filtro rapido PERSONALIZADA). Misma tecnica que el mod
# Drug Dealer (credito v1ld): un grupo de filtro propio agregado a la lista del juego.
# - filterName: clave de texto (Localization.reds, GR-MapFilterStrongholds).
# - filterType: el enum gamedataWorldMapFilter es nativo y no se puede ampliar. WorldMap.RelicDeviceFilter es un
#   record del juego (enum RelicDeviceFilter) que ningun grupo usa. Drug Dealer usa VehicleForSaleFilter: no chocan.
#   Tiene que coincidir con GRStronghold.MapFilter() (Stronghold.reds).
# - mappins vacio a proposito: las guaridas siguen siendo OutpostVariant (grupo ESCANER NCPD del juego); si esa
#   variante se pusiera aca, la casilla mostraria tambien todos los puestos de la NCPD. Que marcador obedece a esta
#   casilla lo decide redscript (wrapper de BaseWorldMapMappinController.PlayHideShowAnim en Stronghold.reds).
WorldMap.GRStrongholdFilterGroup:
  $type: MappinUIFilterGroup_Record
  filterName: GR-MapFilterStrongholds
  filterType: WorldMap.RelicDeviceFilter
  mappins: []
  shouldCollectMappins: false

WorldMap.WorldMapCustomFiltersList.list:
  - !append-once WorldMap.GRStrongholdFilterGroup
