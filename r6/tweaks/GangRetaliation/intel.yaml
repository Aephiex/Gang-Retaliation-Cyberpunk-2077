# Gang Retaliation - intel.
# Hasta el 2026-11-18 esto tenia una accion "Extraer datos" (Takedown.GRExtractData, copia de
# Takedown.BreachUnconsciousOfficer) mas un marcador de mapa/HUD propio para los pandilleros inconscientes
# elegibles. Se retiraron ese dia (confirmados en NOTES.md) una vez el shard de intel probo funcionar de
# forma consistente: hoy el intel se gana recogiendo el shard del botin normal del cadaver, sin interaccion
# ni marcador propios - ver GRIntelSystem en Stronghold.reds (TryKnockOut/GiveIntelShard/OnShardLooted) y
# r6/tweaks/GangRetaliation/shard.yaml para el item en si.
#
# Lo que sigue abajo (variante de marcador + filtro del mapa) sigue en uso: las GUARIDAS (Stronghold.reds,
# GRStronghold) todavia lo necesitan para su propio icono en el mapa grande.

# Casilla "GANG RETALIATION" (guaridas) en la lista de filtros del mapa grande (filtro rapido PERSONALIZADA). Misma tecnica que el mod
# Drug Dealer (credito v1ld): un grupo de filtro propio agregado a la lista del juego.
# - filterName: clave de texto (Localization.reds, GR-MapFilterStrongholds).
# - filterType: el enum gamedataWorldMapFilter es nativo y no se puede ampliar. WorldMap.RelicDeviceFilter es un
#   record del juego (enum RelicDeviceFilter) que ningun grupo usa. Drug Dealer usa VehicleForSaleFilter: no chocan.
#   Tiene que coincidir con GRStronghold.MapFilter() (Stronghold.reds).
# - mappins: las guaridas usan su propia variante de marcador (Mappins.GRStrongholdVariant) y el juego mismo decide
#   cuando se ven segun la casilla (misma tecnica que Icon Framework). La variante es CPO_PingDoorVariant, una variante
#   del modo cooperativo cancelado que el juego individual no usa (comprobado: ningun grupo de filtro la lista, solo
#   Mappins.CPO_PingSystemMappinDefinition). Icon Framework usa CPO_PingGoHereVariant: no chocan.
WorldMap.GRStrongholdVariant:
  $type: gamedataMappinVariant_Record
  enumName: CPO_PingDoorVariant

WorldMap.GRStrongholdFilterGroup:
  $type: MappinUIFilterGroup_Record
  filterName: GR-MapFilterStrongholds
  filterType: WorldMap.RelicDeviceFilter
  mappins:
    - WorldMap.GRStrongholdVariant
  shouldCollectMappins: false

Mappins.GRStrongholdMappinDefinition:
  $type: gamedataMappinDefinition_Record
  showInWorld: true
  showOnMap: true
  showOnMinimap: true
  visibilityRange: 0
  possibleVariants:
    - WorldMap.GRStrongholdVariant

WorldMap.WorldMapCustomFiltersList.list:
  - !append-once WorldMap.GRStrongholdFilterGroup

WorldMap.ZoomLevelImportant.mappinFilterGroups:
  - !append-once WorldMap.GRStrongholdFilterGroup

WorldMap.ZoomLevelAllMappins.mappinFilterGroups:
  - !append-once WorldMap.GRStrongholdFilterGroup

WorldMap.ZoomLevelExtraMappins.mappinFilterGroups:
  - !append-once WorldMap.GRStrongholdFilterGroup

WorldMap.ZoomLevelSubDistricts.mappinFilterGroups:
  - !append-once WorldMap.GRStrongholdFilterGroup
